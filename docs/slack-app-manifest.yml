# Slack app for Knowledge Agent handovers.
#
# 1. https://api.slack.com/apps -> Create New App -> From a manifest -> pick your workspace -> paste this file.
# 2. Basic Information -> App-Level Tokens -> Generate a token with the connections:write scope (xapp-...).
# 3. Install App -> Install to Workspace -> copy the Bot User OAuth Token (xoxb-...).
# 4. Invite the bot to the support channel (/invite @Knowledge Agent) and copy the channel id
#    (channel details, at the bottom; it starts with C).
# 5. In the portal: Integrations -> Slack -> paste both tokens and the channel id, save, then Test.
#
# Socket Mode means the app connects out to Slack: no public URL, no request signing secret.
display_information:
  name: Knowledge Agent
  description: Hands website chats to your team and brings their replies back to the visitor.
  background_color: "#0f766e"
features:
  bot_user:
    display_name: Knowledge Agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - groups:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
