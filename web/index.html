<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Knowledge Agent: ask questions over your own sources and get answers with citations." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Knowledge Agent</title>
    <script>
      // Apply the theme before first paint (same logic as src/lib/theme.ts).
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('knowledge-agent.theme') || 'system';
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
